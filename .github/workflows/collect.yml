name: collect
# Every 5 minutes (GitHub's shortest schedule). GitHub often starts these late or skips runs at
# busy times; the gaps are visible in the data and handled by the 10-minute grid.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-collector.txt
      - run: python -m bikes.collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
